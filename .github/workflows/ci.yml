name: CI

on:
  push:
    branches: [ "main", "feature/*", "task-*" ]
  pull_request:
    branches: [ "main", "staging", "feature/*" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://test_user:test_password@127.0.0.1:5432/voxops_test
      JWT_SECRET: super_secret_dummy_key_for_ci_testing_only
      RESEND_API_KEY: re_placeholder_for_ci
      RESEND_FROM_EMAIL: noreply@example.com
      APP_ENV: development

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: voxops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run database migrations
      run: |
        python -c "
        import os, sys, traceback
        print('Running Alembic upgrade head...')
        try:
            from alembic.config import Config
            from alembic import command
            alembic_cfg = Config('alembic.ini')
            command.upgrade(alembic_cfg, 'head')
            print('Migrations succeeded!')
        except Exception as e:
            err_msg = traceback.format_exc()
            print(f'::error title=Alembic Migration Failure::{e}')
            summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
            if summary_file:
                with open(summary_file, 'a') as f:
                    f.write('### ❌ Migration Failure\n```\n' + err_msg + '\n```\n')
            traceback.print_exc()
            sys.exit(1)
        "

    - name: Start FastAPI server in background
      run: |
        uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
        sleep 5

    - name: Run API Tests
      run: |
        if ! python test_api.py; then
          echo "API Tests failed. Uvicorn logs:"
          cat uvicorn.log
          exit 1
        fi

    - name: Run Pytest Suite
      run: |
        pytest

