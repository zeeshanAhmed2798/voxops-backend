name: CI

on:
  push:
    branches: [ "main", "feature/*", "task-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: voxops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run database migrations
      env:
        DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/voxops_test
      run: |
        alembic upgrade head

    - name: Start FastAPI server in background
      env:
        DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/voxops_test
        JWT_SECRET: super_secret_dummy_key_for_ci
        RESEND_API_KEY: re_placeholder_for_ci
        RESEND_FROM_EMAIL: noreply@example.com
        APP_ENV: development
      run: |
        uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
        # Wait for the server to start
        sleep 5

    - name: Run API Tests
      run: |
        if ! python test_api.py; then
          echo "API Tests failed. Uvicorn logs:"
          cat uvicorn.log
          exit 1
        fi
